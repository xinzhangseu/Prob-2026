---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">发布于 {{ page.date | date: "%Y-%m-%d" }}{% if page.author %} · 作者：{{ page.author }}{% endif %}
{% if page.categories %}
  · 分类：
  {% for cat in page.categories %}
  <span class="post-category">{{ cat }}</span>&nbsp;
  {% endfor %}

{% endif %}
</p>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

</div>
